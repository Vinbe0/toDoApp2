# Optional: a real PostgreSQL for local development.
#   docker compose up -d
#   DATABASE_URL=postgres://todos:todos@localhost:5433/todos npm run dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: todos
      POSTGRES_PASSWORD: todos
      POSTGRES_DB: todos
    ports:
      - "5433:5432"
    volumes:
      - todos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos"]
      interval: 5s
      retries: 10

volumes:
  todos-data:
